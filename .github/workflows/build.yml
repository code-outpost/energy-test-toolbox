name: Build & Release Desktop

# 说明：唯一的 WebView 入口 webview_windows.go 带 //go:build windows，
# 因此本项目只构建 Windows。原 macOS job 在本仓库结构下必然编译失败，已移除。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (tests + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax of every frontend script
        run: node scripts/check-syntax.mjs
      - name: Module registration + render
        run: node scripts/verify.mjs
      - name: Interaction tests
        run: node scripts/test.interact.mjs
      - name: App entry boot test (blank-screen guard)
        run: node scripts/test.boot.mjs
      - name: Numeric golden cases
        run: node scripts/test.formulas.mjs
      - name: Cross-document consistency
        run: node scripts/check-docs.mjs
      - name: PE resource object is present
        run: python scripts/verify_syso.py
      - name: All-modules browser probe (dark + light, real Chromium)
        run: node scripts/check-light-theme.mjs
        env:
          CHROME: google-chrome

  release:
    name: Build Windows exe & publish
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate PE resources (icon + DPI manifest)
        shell: pwsh
        run: |
          $syso = 'rsrc_windows_amd64.syso'
          try {
            go install github.com/akavel/rsrc@latest
            $bin = Join-Path (go env GOPATH) 'bin/rsrc.exe'
            & $bin -ico assets/app.ico -manifest assets/app.manifest -o $syso
            if (-not (Test-Path $syso)) { throw 'rsrc did not produce output' }
            Write-Host 'PE resources regenerated'
          } catch {
            Write-Host "::warning::rsrc regenerated failed ($_), using committed .syso"
          }
          if (-not (Test-Path $syso)) { throw 'missing rsrc_windows_amd64.syso' }

      - name: Build single-file exe
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: 'amd64'
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o EnergyTestToolbox.exe .

      - name: Verify embedded icon and run full suite
        shell: pwsh
        run: |
          python scripts/verify_icon.py EnergyTestToolbox.exe
          node scripts/test.boot.mjs
          node scripts/verify.mjs
          node scripts/test.interact.mjs
          node scripts/test.formulas.mjs

      - name: Hash and sync dist copy
        shell: pwsh
        run: |
          $hash = (Get-FileHash EnergyTestToolbox.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EnergyTestToolbox.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Copy-Item EnergyTestToolbox.exe dist/EnergyTestToolbox.exe -Force
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            EnergyTestToolbox.exe
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            EnergyTestToolbox.exe
            SHA256SUMS.txt
